[project]
name = "memory-assistant"
version = "0.1.0"
description = "A minimal on-device AI assistant with Qdrant Edge memory"
requires-python = ">=3.12"
dependencies = [
    # The embedded shard. Pinned to the version the reference code targets.
    "qdrant-edge-py==0.7.2",
    # CLIP vision (512-d) + Nomic text (768-d), ONNX, CPU.
    "fastembed==0.8.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    # Generates the local HTTPS certificate a phone needs for its microphone.
    "cryptography>=42",
    # Ours: local Whisper speech-to-text.
    "onnx-asr==0.12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Automatic detection and tracking, exactly as the reference does it.
# Without this extra the app falls back to a centre crop, which needs no torch.
detect = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.4.96",
    "lap>=0.5.13",
]

[tool.uv]
package = false
